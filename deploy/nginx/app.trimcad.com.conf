server {
    server_name app.trimcad.com;

    root /var/www/app.trimcad.com;
    index index.html;

    # Keep ACME renewals reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Vite fingerprints these filenames, so a stale copy can never be the wrong build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell names the current asset bundle, so caching it would pin visitors
    # to an old deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
