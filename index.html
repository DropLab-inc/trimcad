<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="apple-touch-icon" href="/trimcad-logo-180.png" />
    <meta name="theme-color" content="#0c161d" />
    <meta
      name="description"
      content="TrimCAD — free, browser-based 2D CAD drafting. Draw, modify, dimension and plot without installing anything."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrimCAD — browser-based 2D CAD drafting" />
    <meta
      property="og:description"
      content="Free and open-source 2D drafting in the browser: layers, object snap, dimensions, DXF import and export, scaled PDF plotting."
    />
    <meta property="og:image" content="/trimcad-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>TrimCAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Settle the theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        var saved = localStorage.getItem('trimcad.theme') || localStorage.getItem('droplabcad.theme')
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
