<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c161d" />
    <title>TrimCAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Settle the theme before the first paint, so a light-mode visitor never sees a dark flash.
      try {
        var saved = localStorage.getItem('trimcad.theme') || localStorage.getItem('droplabcad.theme')
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
